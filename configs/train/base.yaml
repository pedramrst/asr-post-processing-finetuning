# Base training config for the Whisper-output correction SFT task.
# Sections are just for readability -- train.py flattens them onto its Config
# dataclass, so every key here must be a real field (typos raise an error).

model_id: Qwen/Qwen3-1.7B
# Supplies dataset_id -- see configs/data/default.yaml and README's "Data
# config". Set dataset_id explicitly instead (see its own field docstring
# in config.py) to bypass this: either a local path to prepare_split.py's
# curated .jsonl (used as-is below, with eval_fraction carving out
# validation) -- NOT build_dataset.py's raw output directly, run it through
# prepare_split.py first -- or a Hub dataset repo id, in which case set
# train_split/eval_split to its named splits instead and eval_fraction is
# ignored.
data_config: configs/data/default.yaml
train_split: train
eval_split: null
eval_fraction: 0.1
# Deterministically subsamples only the train split to this fraction of its
# rows (eval/validation stays full-size) -- e.g. for a data-scaling ablation.
# null (default, as here) or 1.0 uses every row.
train_fraction: null
input_column: text_whisper
target_column: text
system_prompt: null   # null -> use the default prompt in data.py
# Feature flag to test training/eval against a punctuated target instead of
# the punctuation-free default -- see README's "Punctuation" section. Only
# swaps the system prompt; target_column/test.target_column need to be set
# explicitly too (text_soniox locally, text_raw on Hub datasets/eval
# slices), since the punctuated column has a different name per dataset.
include_punctuation: false

output_dir: ./outputs/qwen3-1.7b-base
# 512 was fine for chunked-only training; assembled rows are now per-channel
# full-call text (median ~114 words in our sample, up to several hundred),
# so this needs enough headroom. Treated as a tunable hyperparameter -- 2048
# covers more of the length distribution than 1024 at the cost of more
# compute per long example, but still not the extreme long-call tail -- see
# README's "Test-set evaluation" notes on chunking those at eval time.
max_length: 2048
# Rows too long for max_length are dropped, not truncated into the target
# (see README) -- train.py prints how many were kept/truncated/dropped.
on_long_example: drop   # drop | truncate
# Feature flag -- see README's "Low-signal correction masking" section.
# Masks out (no loss) target words Whisper's output gives no real signal
# for recovering, so the model isn't trained to guess those at random.
mask_low_signal_corrections: false
# These two also govern evaluate.py's fix_rate_recoverable (which drops the
# same unrecoverable corrections from its denominator) regardless of the
# flag above -- see README's "Test-set evaluation". They're also reused by
# recoverable_correction_weight below, to decide the same "is this word
# guessable" question -- both features share one set of thresholds rather
# than risking two configs disagreeing about the same word.
mask_min_similarity: 0.75
mask_max_common_freq: 1
# Feature flag -- see README's "Recoverable-correction up-weighting"
# section. 1.0 (the default) is a no-op -- every target token trains at
# normal weight. Raise it to give recoverable corrections (Whisper wrong,
# but guessable) extra weight in the loss, on the theory that they're a
# small minority of any example's tokens. Independent of
# mask_low_signal_corrections above -- either can be on without the other.
recoverable_correction_weight: 1.0

# Loads the base model + sets up LoRA via Unsloth's FastLanguageModel instead
# of plain transformers + peft -- reported ~2x faster training and ~70% less
# VRAM on Qwen3/Gemma3 (see README's "Unsloth" section). Requires a CUDA GPU
# and the `unsloth` package; not verified end-to-end in this repo (written
# without CUDA available) -- test on a real GPU before relying on it.
use_unsloth: false

training:
  # 2, not 3: research on LoRA SFT (Raschka's empirical study) found extra
  # epochs actively hurt via overfitting, and prepare_split.py's agree-bucket
  # upsampling means some rows are already duplicated in this dataset -- 3
  # epochs would see those ~6x, compounding the same risk.
  num_train_epochs: 2.0
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  warmup_ratio: 0.05   # within the commonly recommended 5-10% of steps
  logging_steps: 10
  eval_steps: 200
  save_steps: 200
  save_total_limit: 3
  seed: 42

lora:
  r: 16
  alpha: 32
  dropout: 0.05

quantization:
  load_in_4bit: false   # QLoRA; needs bitsandbytes + a CUDA GPU

hub:
  push_to_hub: true
  # ONE shared repo for every experiment -- keep this the same across all
  # your configs; each run gets its own folder inside it (see `folder`).
  repo_id: PedramR/ASR_Post-processing
  folder: null   # null -> defaults to output_dir's basename ("qwen3-1.7b-base" here)
  private: true

tensorboard:
  logging_dir: null   # null -> defaults to <output_dir>/tb

# Runs the model against a test set at every checkpoint save, computes WER,
# and writes test_eval/predictions.jsonl + metrics.json under output_dir.
# Leave dataset_id null to skip this entirely.
test:
  dataset_id: ErfanRou/callcc-test-1k
  split: test
  input_column: text_whisper
  target_column: text
  max_new_tokens: 1024   # raised alongside max_length -- a full-length correction shouldn't get cut off
  batch_size: 8
  max_examples: null   # full test set -- used for the one-time baseline (pre-training) and final evals
  # Separate, usually smaller cap for the *repeated* per-checkpoint eval --
  # with a frequent eval_steps/save_steps this can fire hundreds of times, so
  # running the full set there every time multiplies eval cost far beyond
  # training itself. null falls back to max_examples above (no separate cap).
  checkpoint_max_examples: null
  # Optional second, small eval set focused on named entities -- see
  # src/build_entity_eval_slice.py and README's "Named-entity eval slice".
  # Aggregate WER above mixes entity-heavy and entity-free calls together,
  # which hides weak named-entity correction inside a number dominated by
  # everything else. null skips this entirely -- explicit here (rather than
  # left unset) specifically to override data_config's own entity_dataset_id/
  # entity_row_type defaults, since this template demonstrates the off
  # state; other configs in this repo turn it on by leaving both unset
  # instead. entity_row_type is inert either way once entity_dataset_id is
  # null (run_secondary_eval() no-ops before ever looking at it), but nulling
  # it too keeps this template's "everything off" state unambiguous.
  entity_dataset_id: null
  entity_row_type: null
  # Same idea, for typo/dictation-form errors (stutters, word-boundary
  # merges, ZWNJ) instead of named entities -- see
  # src/build_typo_eval_slice.py. A regression guard, not an improvement
  # target: the model already handles this error category well, so the
  # point is catching if pushing harder on entities erodes it.
  typo_dataset_id: null
  typo_row_type: null
  # Weight on fix_rate vs. preservation_rate in targeted_score -- see
  # README's "Test-set evaluation". 0.5 (equal weight) is the starting
  # point; raise it to prioritize catching more errors even at some
  # over-correction risk, lower it to prioritize not touching text that
  # was already fine. fix_rate/preservation_rate are always reported
  # unweighted too, regardless of this.
  fix_weight: 0.5

# false | true (resume from the latest checkpoint under output_dir) |
# a local checkpoint path | "hub" to pull this run's folder from hub.repo_id first
resume_from_checkpoint: false
# Opt-in feature flag -- see README's "Continuing from an existing LoRA"
# section. Seeds this (brand-new, otherwise free to differ in every other
# way) run's LoRA weights from an existing adapter instead of the usual
# zero-initialized start -- a local path, or a Hub repo id (with
# init_lora_from_subfolder for a repo that holds multiple runs' adapters in
# per-run subfolders, e.g. "qwen3.5-2b"). Mutually exclusive with
# resume_from_checkpoint (that restores an in-progress run's own trainer
# state; this only seeds a new run's starting weights). null (default)
# keeps the normal zero-initialized LoRA start.
init_lora_from: null
init_lora_from_subfolder: null
