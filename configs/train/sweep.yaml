# Queue of training jobs for run_sweep.py. Each job names its own `config`
# file (a full standalone config, not necessarily related to any other job's)
# plus an optional `overrides` on top for quick tweaks without duplicating a
# whole file. Jobs run one after another on the same GPU.
#
# Current queue: a single run, qwen3.5-2b-masked-weighted.yaml (low-signal
# masking + recoverable-correction weighting both on) -- time-constrained, so
# the masking-off / masking-only legs of the A/B/C are dropped for now. To
# bring them back, add jobs for configs/train/qwen3.5-2b.yaml and
# configs/train/qwen3.5-2b-masked.yaml with these SAME overrides, so the
# comparison stays clean. gemma-3-1b-it is intentionally out of this queue --
# Qwen has been the stronger model so far; add it back the same way
# (config: configs/train/gemma-3-1b-it.yaml + these same overrides) if you
# want it in a future comparison.
#
# This batch's overrides:
#   - train_fraction: 0.5 -- first-pass experiments on half the curated
#     data, not a data-scaling ablation; only train_fraction changes, eval
#     stays on the full test set (see checkpoint_max_examples below).
#   - use_unsloth: false (explicit, same as the default) -- see README's
#     "Unsloth". Off for this run: (1) its LoRA path targets only the 7
#     standard projection names, which misses Qwen3.5's linear-attention
#     modules (in_proj_qkv/in_proj_z/in_proj_a/in_proj_b/out_proj) that the
#     plain path's "all-linear" covers -- a smaller adapter than earlier
#     runs, so not comparable to them; (2) WeightedLossTrainer's own loss
#     has never been run together with Unsloth. Still unverified end-to-end.
#   - training.eval_steps/save_steps: 500 (up from 100) -- fewer, less
#     disruptive checkpoint pauses.
#   - test.checkpoint_max_examples: null -- was 150; now every checkpoint
#     eval covers the full test set (falls back to test.max_examples, also
#     null), not just the one-time baseline/final passes. Affordable now
#     that checkpoints are 5x less frequent (500 vs. 100 steps apart).
#   - test.checkpoint_eval_main: false -- the *combination* of the previous
#     point with eval_steps=500 (not 100) turned out not to be the win it
#     looked like on its own: null checkpoint_max_examples means the main
#     test set's per-checkpoint pass now runs its FULL ~2,000 rows (not
#     capped at 150) every checkpoint, which measured slower in practice
#     than the previous cadence despite firing 5x less often. This skips
#     the main set at checkpoint time entirely (baseline/final still run it,
#     uncapped, same as before) and leaves the entity+typo eval (1,010 + 358
#     rows, already run every checkpoint regardless) as the per-checkpoint
#     signal -- also a more direct read on this specific comparison, since
#     it's exactly what masking targets. Best-checkpoint tracking falls back
#     to the mean of entity/typo WER instead of going inert -- see
#     Config.test_checkpoint_eval_main's docstring.
#
# dataset_id/test.entity_dataset_id/typo_dataset_id/row types are NOT
# overridden here -- the config already pull the prebuilt Hub dataset
# (PedramR/ASR_Post-processing-dataset) and the combined eval repo via
# data_config: configs/data/default.yaml (see README's "Data config").
#
# Hub folder safety: PedramR/ASR_Post-processing (the shared Hub repo the
# config's hub.repo_id points at) already has real run data under
# qwen3.5-2b/ and gemma-3-1b-it/ (verified directly via the Hub API before
# writing this) -- NOT to be overwritten. hub.folder is left unset here on
# purpose: run_sweep.py auto-namespaces it to each job's own `name` below
# when not overridden, so this job lands in a new
# qwen3.5-2b-50pct-masked-weighted/ folder in the same repo instead of
# colliding with the existing ones. Don't rename this job to "qwen3.5-2b" or
# "gemma-3-1b-it" without also setting hub.folder explicitly to something
# that isn't already in the repo.
#
# output_dir/tensorboard.logging_dir are also always auto-namespaced per job
# under output_root, the same way, unless a job's `overrides` sets them.
#
# Generate the data this job trains on first if using source: build instead
# of the prebuilt default -- see README's "Data config":
#   python src/build_from_config.py --config configs/data/default.yaml

output_root: ./outputs/qwen-mask-weighted
# Don't auto-launch a longer follow-up run of the sweep's winner (see
# README's "Sweeps auto-continue their winner") -- with a single job the
# "winner" is just that job, and there's no time budget for more.
followup: false

jobs:
  - name: qwen3.5-2b-50pct-masked-weighted
    config: configs/train/qwen3.5-2b-masked-weighted.yaml
    overrides:
      train_fraction: 0.5
      use_unsloth: false
      training:
        eval_steps: 500
        save_steps: 500
      test:
        checkpoint_max_examples: null
        checkpoint_eval_main: false
