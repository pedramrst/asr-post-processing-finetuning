# Third leg of the masking/weighting A/B/C: builds on qwen3.5-2b-masked.yaml
# (masking on), additionally turning on recoverable_correction_weight -- see
# README's "Recoverable-correction up-weighting" and
# Config.recoverable_correction_weight. Everything else identical to both
# other configs in this series.
#
# 2.0 here (down from an earlier 3.0) -- up-weights every recoverable-
# correction target token to 2x normal loss weight. Lowered after the
# qwen3.5-2b-50pct-masked-weighted run (Hub folder of that name) showed
# train/grad_norm and train/loss oscillating throughout training (not
# damping over time) and test/entity_hallucination_rate spiking to ~13-18%
# around steps 3000-5000 before only partially recovering -- consistent
# with high batch-to-batch gradient variance from a small per-device batch
# (2) combined with a heavy 3x weight on a token subset whose count varies
# a lot per batch (entity-row upsampling + weighting compounding). 2.0
# reduces that disparity; still illustrative, not itself tuned.
#
# Run this after comparing qwen3.5-2b.yaml vs. qwen3.5-2b-masked.yaml, not
# instead of that comparison -- if masking alone already moved
# test_fix_rate_recoverable a lot, this tells you whether weighting adds
# anything further on top; if masking barely moved it, this isolates whether
# weighting is doing the real work. Compare all three runs' test_fix_rate_recoverable
# / test_targeted_score / test_preservation_rate together, not just this one
# against the masked-only run -- and watch test_preservation_rate specifically,
# since pushing harder on corrections risks over-correction (the model
# "fixing" text that didn't need it).
#
# If you also want an isolated weighted-but-NOT-masked run (to separate the
# two effects instead of only ever seeing them stacked), that doesn't need
# its own file -- one --set away from qwen3.5-2b.yaml:
#   ./run.sh train qwen3.5-2b --set recoverable_correction_weight=3.0 \
#     --set output_dir=./outputs/qwen3.5-2b-weighted
#
# Batch size: per-device 2 with gradient_accumulation 16 (effective batch
# size 32, up from 16). Per-device stays 2 -- per-device 4 was tried first (a
# hoped-for throughput improvement) and OOM'd on a 32GB RTX 5090, and
# quantization.load_in_4bit / use_unsloth are both off the table for now (4-bit
# risks quality on a small 2B model in Persian; Unsloth's LoRA path misses
# Qwen3.5's linear-attention projection names -- see the Unsloth note above
# and README's "Unsloth"). gradient_accumulation_steps doubled instead, same
# per-device memory footprint, more rows averaged into each optimizer step --
# the other half of addressing the grad_norm/loss oscillation noted above
# (this averages out per-batch variance directly; the lower weight above
# reduces its source). Doubling this halves the number of optimizer steps for
# the same epoch count -- warmup_ratio/lr_scheduler_type below are fraction-
# of-total-steps based, so they scale automatically; save_steps/eval_steps
# (below, overridden by sweep.yaml to 1000) now span roughly 2x the wall-clock
# per checkpoint.


model_id: Qwen/Qwen3.5-2B
# Supplies dataset_id (the prebuilt Hub dataset, currently) and, below,
# test.entity_dataset_id/typo_dataset_id/entity_row_type/typo_row_type --
# see configs/data/default.yaml and README's "Data config".
data_config: configs/data/default.yaml
train_split: train
eval_split: null
eval_fraction: 0.1
train_fraction: null   # null -> use every row; set e.g. 0.2 for a data-scaling ablation
input_column: text_whisper
target_column: text
system_prompt: null

output_dir: ./outputs/qwen3.5-2b-masked-weighted
max_length: 2048   # see base.yaml's comment -- assembled rows are now per-channel full-call text
on_long_example: drop   # drop | truncate

# The two differences from qwen3.5-2b.yaml -- see this file's header comment.
mask_low_signal_corrections: true
mask_min_similarity: 0.75
mask_max_common_freq: 1
recoverable_correction_weight: 2.0

# New for v2 -- see Config.short_target_eos_weight's docstring and README's
# "Short-target end-of-sequence down-weighting". Down-weights the closing
# end-of-turn token(s) of any target <= short_target_max_words words to
# 0.3x normal loss weight, to counter a real fine-tuning-induced failure
# found in qwen3.5-2b-50pct-masked-weighted's final-checkpoint predictions:
# the model stopped generating early on 10.5% of the main test set (usually
# right after a call's opening greeting), vs. 0.6% at the pre-training
# baseline on the same rows. Traced to short training rows whose call
# genuinely ends right after a short phrase -- a correct label, but
# structurally identical to the *opening* of almost every call. Watch
# test_premature_stop_rate (new this run, see README's "Test-set
# evaluation") on entity/typo/main-set curves to see whether this actually
# helps -- 0.3 here is a starting point, not tuned.
short_target_eos_weight: 0.3
short_target_max_words: 20

training:
  # 1.0, down from 2.0 -- paired with sweep.yaml's train_fraction: 1.0 (was
  # 0.5), which keeps the row-passes and wall-clock identical (~177k either
  # way) while making every example unique instead of seen twice. The first
  # pass's TensorBoard logs showed the cost of that second pass directly:
  # train/loss fell the whole run while eval WER peaked at step 2000 (0.36
  # epochs) and never recovered, and loss dropped 11.3% discontinuously at
  # the epoch-2 boundary vs. 2.4% for a mid-epoch control -- memorization,
  # not learning. A single epoch also lets the linear LR schedule actually
  # anneal within the window where the model is still improving: at the
  # first pass's own optimum the LR was still 86% of peak, i.e. the best
  # checkpoint was taken at nearly full learning rate and never annealed.
  # See sweep.yaml's train_fraction note for the corpus_freq side effect.
  num_train_epochs: 1.0
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 16
  learning_rate: 1.0e-4
  warmup_ratio: 0.05   # within the commonly recommended 5-10% of steps
  logging_steps: 10
  eval_steps: 100
  save_steps: 100
  save_total_limit: 3
  seed: 42
  # Stops the run once the best-checkpoint WER (see README's "best checkpoint
  # by WER", update_best_checkpoint()) hasn't improved for this many
  # consecutive checkpoint saves. The qwen3.5-2b-50pct-masked-weighted run
  # (best_wer=0.223 at step 2000 of 11146) never improved on that again
  # across the remaining 9 checkpoints -- a patience this low would have
  # stopped that run ~8000 steps earlier.
  #
  # Counted in CHECKPOINTS, not steps, so it's coupled to save_steps: with
  # sweep.yaml's save_steps=500 override, patience=3 means stopping after
  # 1,500 steps without a new best. Sized against where the optimum is
  # expected here (~step 1000, i.e. the first pass's step-2000 optimum
  # halved by the effective-batch change), leaving room for it to land a
  # couple of checkpoints later than that without being cut off early.
  # Revisit this number whenever save_steps changes.
  early_stopping_patience: 3

lora:
  r: 32   # up from 16 -- alpha doubled alongside it to keep the alpha/r=2 scale unchanged
  alpha: 64
  dropout: 0.05

quantization:
  load_in_4bit: false

hub:
  push_to_hub: true
  repo_id: PedramR/ASR_Post-processing   # same shared repo as qwen3.5-2b.yaml
  folder: null   # null -> defaults to output_dir's basename ("qwen3.5-2b-masked-weighted" here)
  private: false

tensorboard:
  logging_dir: null   # null -> defaults to <output_dir>/tb

test:
  dataset_id: ErfanRou/callcc-test-1k
  split: test
  input_column: text_whisper
  target_column: text
  max_new_tokens: 1024
  # Up from 8 -- generation has no gradient/optimizer memory of its own, but
  # this still runs inside the training process's existing GPU footprint
  # (LoRA + AdamW state are already resident during a mid-training eval).
  # Measured: this reproduced a CUDA OOM on the step right after the first
  # checkpoint eval, twice, on a 32GB RTX 5090 -- not a raw capacity problem
  # (the error showed ~7.5GiB "reserved but unallocated") but generation's
  # KV-cache churn fragmenting PyTorch's allocator badly enough to break the
  # next backward pass. Mitigated via torch.cuda.empty_cache() in
  # evaluate.py's run_test_eval() + PYTORCH_CUDA_ALLOC_CONF=expandable_segments
  # (run.sh) -- if it recurs anyway, drop this back down before anything else.
  batch_size: 16
  max_examples: null   # full test set -- only used for the one-time baseline/final evals
  # Repeated per-checkpoint eval (every eval_steps/save_steps) uses a much
  # smaller slice instead, since callcc-test-1k's full ~1k examples at
  # max_new_tokens=1024 was taking ~3h per pass -- multiplied across ~635
  # checkpoint saves in this run, that dwarfs training time itself. Adjust
  # if the trend signal is too noisy or still too slow.
  checkpoint_max_examples: 150
  # entity_dataset_id/entity_row_type/typo_dataset_id/typo_row_type come
  # from data_config above (configs/data/default.yaml's `eval` section) --
  # see README's "Named-entity eval slice"/"Uploading the eval slices as
  # one Hub dataset".
  # Weight on fix_rate vs. preservation_rate in targeted_score -- see
  # README's "Test-set evaluation". 0.5 (equal weight) for now.
  fix_weight: 0.5

resume_from_checkpoint: false
