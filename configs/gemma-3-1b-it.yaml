# Standalone config for gemma-3-1b-it -- gets its own file rather than a
# model_id override on top of base.yaml, since base.yaml's output_dir/hub
# folder are literally named "qwen3-1.7b-base": overriding just model_id
# there (as the old sweep.yaml did) would silently write this model's
# checkpoints into a directory and Hub folder named after a different model.
#
# It's the smallest of the four candidate models (~1B, 2GB on disk) and gets
# the most headroom on a 32GB RTX 5090, so per-device batch size is pushed
# higher than base.yaml's for throughput -- an estimate, not a measurement
# (nothing here has run on real hardware yet). If GPU utilization looks low
# during a step (check `nvidia-smi`), there's likely room to push it
# further; back off toward base.yaml's batch=4 if you hit OOM.
#
# Its chat template has no separate system-turn role (system content gets
# folded into the first user turn) -- verified this doesn't break anything:
# data.py's masking only depends on the prompt being a token-level prefix of
# the full sequence, which still holds.

model_id: google/gemma-3-1b-it
dataset_id: ./asr_dataset_curated.jsonl
train_split: train
eval_split: null
eval_fraction: 0.1
train_fraction: 0.2   # data-scaling ablation: train on 20% of the curated set, not all of it
input_column: text_whisper
target_column: text
system_prompt: null

output_dir: ./outputs/gemma-3-1b-it
max_length: 2048
on_long_example: drop

training:
  # 2, not 3 -- see base.yaml's comment: extra epochs risk overfitting,
  # compounded by prepare_split.py's row upsampling.
  num_train_epochs: 2.0
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-4
  warmup_ratio: 0.05   # within the commonly recommended 5-10% of steps
  logging_steps: 10
  eval_steps: 100
  save_steps: 100
  save_total_limit: 3
  seed: 42

lora:
  r: 32   # up from 16 -- alpha doubled alongside it to keep the alpha/r=2 scale unchanged
  alpha: 64
  dropout: 0.05

quantization:
  load_in_4bit: false

hub:
  push_to_hub: true
  repo_id: PedramR/ASR_Post-processing   # same shared repo as the other configs
  folder: null   # null -> defaults to output_dir's basename ("gemma-3-1b-it" here)
  private: false

tensorboard:
  logging_dir: null

test:
  dataset_id: ErfanRou/callcc-test-1k
  split: test
  input_column: text_whisper
  target_column: text
  max_new_tokens: 1024
  # Up from 8 -- generation has no gradient/optimizer memory of its own, but
  # this still runs inside the training process's existing GPU footprint
  # (LoRA + AdamW state are already resident during a mid-training eval).
  # This exact setup (same batch_size, same shared-process eval) reproduced
  # a CUDA OOM on qwen3.5-2b's run, twice, on the step right after the first
  # checkpoint eval on a 32GB RTX 5090 -- not a raw capacity problem (the
  # error showed ~7.5GiB "reserved but unallocated") but generation's
  # KV-cache churn fragmenting PyTorch's allocator badly enough to break the
  # next backward pass. Mitigated via torch.cuda.empty_cache() in
  # evaluate.py's run_test_eval() + PYTORCH_CUDA_ALLOC_CONF=expandable_segments
  # (run.sh) -- if it recurs anyway, drop this back down before anything else.
  batch_size: 16
  max_examples: null   # full test set -- only used for the one-time baseline/final evals
  # Repeated per-checkpoint eval (every eval_steps/save_steps) uses a much
  # smaller slice instead, since callcc-test-1k's full ~1k examples at
  # max_new_tokens=1024 was taking ~3h per pass -- multiplied across many
  # checkpoint saves in a run, that dwarfs training time itself. Adjust if
  # the trend signal is too noisy or still too slow.
  checkpoint_max_examples: 150
  # Small (268-row), ground-truth-backed named-entity slice of
  # callcc-test-1k -- see src/build_entity_eval_slice.py and README's
  # "Named-entity eval slice". Tracked separately (test_entity_wer etc.) so
  # weak entity correction can't hide inside the aggregate test_wer number.
  entity_dataset_id: ./data/entity_eval_slice.jsonl

resume_from_checkpoint: false
