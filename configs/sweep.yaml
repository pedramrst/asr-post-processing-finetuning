# Queue of training jobs for run_sweep.py. Each job names its own `config`
# file (a full standalone config, not necessarily related to any other job's)
# plus an optional `overrides` on top for quick tweaks without duplicating a
# whole file. Jobs run one after another on the same GPU.
#
# Currently just the two models actually being fine-tuned right now
# (Qwen3.5-2B and gemma-3-1b-it) -- Qwen3-1.7B and gemma-4-E2B-it are on
# hold, not removed; add jobs back for them (config: configs/base.yaml for
# Qwen3-1.7B, a new dedicated config for gemma-4-E2B-it -- see its own batch
# sizing note from the GPU discussion) when/if they're back in scope.
#
# output_dir/tensorboard.logging_dir/hub.folder are always auto-namespaced
# per job under output_root -- even if the job's own config file sets them --
# unless you set them explicitly via that job's `overrides`. This is what
# keeps results directly comparable (point TensorBoard at output_root to see
# them all) regardless of what a standalone config file happens to contain.
# hub.repo_id is NOT touched here -- every job's own config already points at
# the same shared repo, so both jobs below end up as two folders in one repo.
#
# Generate the data these jobs train on first with:
#   python src/build_dataset.py --assembled-ratio 0.3 --output-dir ./asr_dataset.jsonl
#   python src/prepare_split.py --input ./asr_dataset.jsonl --output ./asr_dataset_curated.jsonl

output_root: ./outputs/model-comparison

jobs:
  - name: qwen3.5-2b
    config: configs/qwen3.5-2b.yaml

  - name: gemma-3-1b-it
    config: configs/gemma-3-1b-it.yaml
